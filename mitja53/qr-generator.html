<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR - Rojstnodnevni AI protokol</title><style>body{font-family:Arial,sans-serif;background:#07100a;color:#e8f2eb;max-width:700px;margin:50px auto;padding:20px}input{width:100%;padding:12px;box-sizing:border-box;margin:8px 0 14px}button{padding:12px 18px;cursor:pointer}#qr{margin-top:25px;background:#fff;padding:18px;width:max-content}</style></head><body><h1>QR generator</h1><p>Vnesi končni javni URL igre.</p><input id="url" placeholder="https://.../index.html"><button onclick="makeQR()">Ustvari QR</button><div id="qr"></div><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>function makeQR(){const u=document.getElementById('url').value.trim();if(!u)return;document.getElementById('qr').innerHTML='';new QRCode(document.getElementById('qr'),{text:u,width:280,height:280});}</script></body></html>
